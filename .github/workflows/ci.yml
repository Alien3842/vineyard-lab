name: CI
on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
permissions:
  contents: read
jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: docker build -t vineyard:ci .
      - name: Smoke test built image
        run: |
          docker run -d --name vineyard -p 8000:8000 vineyard:ci
          trap 'docker logs vineyard; docker rm -f vineyard' EXIT
          python scripts/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
