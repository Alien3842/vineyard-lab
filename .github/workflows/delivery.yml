name: Delivery
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, main]
permissions:
  contents: read
  packages: write
concurrency:
  group: delivery-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  deliver:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Create environment-specific runtime file
        env:
          CONFIGURED_ENV: ${{ secrets.APP_ENV }}
          EXPECTED_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
        run: |
          test "$CONFIGURED_ENV" = "$EXPECTED_ENV"
          printf 'APP_ENV=%s\n' "$CONFIGURED_ENV" > .env
      - name: Build immutable image
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:$SHA"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label org.opencontainers.image.revision="$SHA" -t "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Automated deployment to ephemeral runner and readiness gate
        env:
          EXPECTED_ENV: ${{ github.event.workflow_run.head_branch == 'main' && 'production' || 'staging' }}
        run: |
          docker run -d --name vineyard --env-file .env -p 8000:8000 "$IMAGE"
          trap 'docker logs vineyard; docker rm -f vineyard; rm -f .env' EXIT
          python scripts/smoke.py --environment "$EXPECTED_ENV"
      - name: Deliver verified image to GHCR
        run: docker push "$IMAGE"
      - name: Write delivery receipt
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "Verified image: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Container ran on a temporary GitHub runner; no persistent hosting is configured.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove runtime configuration
        if: always()
        run: rm -f .env
